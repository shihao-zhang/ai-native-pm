<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc"><title id="title">AI-native PM：项目协作与方法内化</title><desc id="desc">首次接入进入项目协作，需求和原型迭代，设计走查与交付按需进行。实战反馈经去重、对齐和验证形成新方法版本，由项目明确采用。项目上下文与可复用方法分别维护。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52786c"/></marker></defs><rect width="1440" height="1040" fill="#f6f5f0"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif" fill="#233a35"><text x="48" y="51" font-size="31" font-weight="700" fill="#233a35">AI-native PM</text><text x="48" y="84" font-size="21" font-weight="400" fill="#233a35">一个项目开展真实工作，一份方法持续改进</text><text x="1130" y="48" font-size="16" font-weight="400" fill="#65766e">0.6 候选 · 协作导航</text><rect x="48" y="114" width="1344" height="78" rx="12" fill="#e8f0eb" stroke="#cdd9d3"/><text x="68" y="145" font-size="20" font-weight="600" fill="#233a35">首次接入</text><text x="220" y="145" font-size="19" font-weight="400" fill="#233a35">选择或建立项目 → 核文件根与权限 → 找已有事项 → 选当前任务入口</text><text x="220" y="174" font-size="16" font-weight="400" fill="#52645e">GETTING_STARTED · 一个需求、一个 chat 即可开始；多需求才按需分工</text><text x="48" y="233" font-size="23" font-weight="600" fill="#233a35">项目层｜产品协作</text><text x="1040" y="233" font-size="16" font-weight="400" fill="#65766e">按目标进入，不强制逐站执行</text><rect x="48" y="256" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="66" y="286" font-size="22" font-weight="600" fill="#233a35">目标与事实</text><text x="66" y="316" font-size="16" font-weight="400" fill="#52645e">PM确定范围与取舍</text><text x="66" y="340" font-size="16" font-weight="400" fill="#52645e">读取项目已有决定</text><rect x="323" y="256" width="244" height="112" rx="12" fill="#e8f0eb" stroke="#cdd9d3"/><text x="341" y="286" font-size="22" font-weight="600" fill="#233a35">需求共写</text><text x="341" y="316" font-size="16" font-weight="400" fill="#52645e">prd-cowrite</text><text x="341" y="340" font-size="16" font-weight="400" fill="#52645e">定义、图示、完成判据</text><rect x="598" y="256" width="244" height="112" rx="12" fill="#e8f0eb" stroke="#cdd9d3"/><text x="616" y="286" font-size="22" font-weight="600" fill="#233a35">原型共创</text><text x="616" y="316" font-size="16" font-weight="400" fill="#52645e">prototype-codesign</text><text x="616" y="340" font-size="16" font-weight="400" fill="#52645e">交互表达与设计决策</text><rect x="873" y="256" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="891" y="286" font-size="22" font-weight="600" fill="#233a35">设计走查与修复</text><text x="891" y="316" font-size="16" font-weight="400" fill="#52645e">定位当前承接人</text><text x="891" y="340" font-size="16" font-weight="400" fill="#52645e">原状态复验关闭问题</text><rect x="1148" y="256" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="1166" y="286" font-size="22" font-weight="600" fill="#233a35">按约定交付</text><text x="1166" y="316" font-size="16" font-weight="400" fill="#52645e">核实际接收副本</text><text x="1166" y="340" font-size="16" font-weight="400" fill="#52645e">保留未验与开放项</text><path d="M292 310 L319 310" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M567 310 L594 310" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M842 310 L869 310" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1117 310 L1144 310" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M596 337 L570 337" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M995 370 V408 H445 V370" fill="none" stroke="#52786c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="580" y="432" font-size="16" font-weight="400" fill="#52645e">反馈按影响回到需求或设计；沿用已有确认</text><rect x="48" y="461" width="850" height="95" rx="12" fill="#fff" stroke="#cdd9d3"/><text x="68" y="491" font-size="20" font-weight="600" fill="#233a35">项目自己的上下文</text><text x="68" y="523" font-size="17" font-weight="400" fill="#233a35">业务事实 · 需求与设计 · 状态与写区 · DS／工程入口 · 经验与证据</text><rect x="922" y="461" width="470" height="95" rx="12" fill="#fff" stroke="#cdd9d3"/><text x="942" y="491" font-size="20" font-weight="600" fill="#233a35">按需能力，不加必经阶段</text><text x="942" y="523" font-size="16" font-weight="400" fill="#233a35">决策拷问 · 静态报告 · 影响与证据核查</text><text x="48" y="606" font-size="23" font-weight="600" fill="#233a35">方法层｜经验内化</text><text x="1010" y="606" font-size="16" font-weight="400" fill="#65766e">references/learning-loop · 按需读取</text><rect x="48" y="631" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="66" y="661" font-size="22" font-weight="600" fill="#233a35">当事人记录</text><text x="66" y="691" font-size="16" font-weight="400" fill="#52645e">用户反馈或自然节点</text><text x="66" y="715" font-size="16" font-weight="400" fill="#52645e">保留来源、版本、边界</text><rect x="323" y="631" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="341" y="661" font-size="22" font-weight="600" fill="#233a35">核证据并去重</text><text x="341" y="691" font-size="16" font-weight="400" fill="#52645e">已有／项目特有</text><text x="341" y="715" font-size="16" font-weight="400" fill="#52645e">可迁移候选／待验证</text><rect x="598" y="631" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="616" y="661" font-size="22" font-weight="600" fill="#233a35">对齐后改唯一源</text><text x="616" y="691" font-size="16" font-weight="400" fill="#52645e">常用判断进共创</text><text x="616" y="715" font-size="16" font-weight="400" fill="#52645e">详细方法与案例按需</text><rect x="873" y="631" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="891" y="661" font-size="22" font-weight="600" fill="#233a35">相关验证与封包</text><text x="891" y="691" font-size="16" font-weight="400" fill="#52645e">按改动验证与回读</text><text x="891" y="715" font-size="16" font-weight="400" fill="#52645e">形成新候选及说明</text><rect x="1148" y="631" width="244" height="112" rx="12" fill="#ffffff" stroke="#cdd9d3"/><text x="1166" y="661" font-size="22" font-weight="600" fill="#233a35">项目选择采用</text><text x="1166" y="691" font-size="16" font-weight="400" fill="#52645e">核实际载入版本</text><text x="1166" y="715" font-size="16" font-weight="400" fill="#52645e">真实反馈继续回流</text><path d="M292 685 L319 685" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M567 685 L594 685" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M842 685 L869 685" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1117 685 L1144 685" fill="none" stroke="#52786c" stroke-width="2" marker-end="url(#arrow)"/><path d="M1270 368 V450 H1415 V580 H24 V685 H45" fill="none" stroke="#a4814f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><path d="M1392 687 H1425 V213 H720 V253" fill="none" stroke="#52786c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><text x="50" y="789" font-size="21" font-weight="600" fill="#233a35">通用方法统一维护 → 生成 plugin 与独立 skill 包；安装副本不手改</text><text x="50" y="824" font-size="18" font-weight="400" fill="#52645e">项目资料留各自项目；专线是可选分工，权威信息落在团队可访问资产中</text><rect x="48" y="860" width="1344" height="116" rx="12" fill="#eeeae0" stroke="#ded8cb"/><text x="68" y="892" font-size="20" font-weight="600" fill="#233a35">边界与读图方式</text><text x="68" y="924" font-size="17" font-weight="400" fill="#233a35">实线：可能的工作衔接　虚线：反馈与版本采用　阶段含义以对应流程为准</text><text x="68" y="952" font-size="17" font-weight="400" fill="#233a35">这张图不启动自动化、不授权外发，也不把“已交付”解释为真实服务全部验通。</text><text x="48" y="1010" font-size="15" font-weight="400" fill="#65766e">架构说明见同包 WORKFLOW.md；首次接入与元方法均由 README 导航。</text></g></svg>