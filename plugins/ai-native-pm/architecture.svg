<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740" role="img" aria-labelledby="title desc">
<title id="title">AI-native PM：项目协作与方法内化</title>
<desc id="desc">项目上下文分为必填、条件必填和柔性信息。产品协作五步为核心，辅助能力区分用户主动唤起和Agent按任务调用。经验内化形成候选版本，由项目选择采用。</desc>
